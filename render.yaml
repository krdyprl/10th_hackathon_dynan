services:
  - type: web
    name: inktrace-api
    runtime: python
    repo: https://github.com/krdyprl/10th_hackathon_dynan
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "InkTrace AI <noreply@inktrace.ai>"
      - key: CORS_ORIGINS
        value: "https://inktracemental.netlify.app,https://main--inktracemental.netlify.app"
